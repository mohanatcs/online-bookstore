openapi: 3.0.3

info:
  title: Online Bookstore API
  description: REST API for managing users, books, shopping carts, and orders.
  version: 1.0.0

servers:
  - url: http://localhost:8081
    description: Local development server

tags:
  - name: Authentication
    description: User registration and login APIs
  - name: Books
    description: Book management APIs
  - name: Shopping Cart
    description: Shopping cart management APIs
  - name: Orders
    description: Order and checkout APIs

paths:

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Invalid request

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate a user using email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid email or password

  /api/books:
    get:
      tags:
        - Books
      summary: Get all books
      description: Retrieve all available books.
      responses:
        '200':
          description: Books retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookResponse'

  /api/books/{id}:
    get:
      tags:
        - Books
      summary: Get book by ID
      description: Retrieve a book using its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Book retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '404':
          description: Book not found

    put:
      tags:
        - Books
      summary: Update book
      description: Update an existing book.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '200':
          description: Book updated successfully
        '400':
          description: Invalid request
        '404':
          description: Book not found

    delete:
      tags:
        - Books
      summary: Delete book
      description: Delete an existing book.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Book deleted successfully
        '404':
          description: Book not found

  /api/books/create:
    post:
      tags:
        - Books
      summary: Create a new book
      description: Add a new book to the bookstore.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '201':
          description: Book created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          description: Invalid request

  /api/cart/create/items:
    post:
      tags:
        - Shopping Cart
      summary: Add book to cart
      description: Add a book to the user's shopping cart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
      responses:
        '200':
          description: Book added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: Invalid request
        '404':
          description: User or book not found

  /api/cart/{userId}:
    get:
      tags:
        - Shopping Cart
      summary: View cart
      description: Retrieve the shopping cart for a user.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Cart retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '404':
          description: Cart not found

  /api/cart/update/items/{cartItemId}:
    put:
      tags:
        - Shopping Cart
      summary: Update cart item
      description: Update the quantity of a book in the cart.
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartRequest'
      responses:
        '200':
          description: Cart item updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: Invalid request
        '404':
          description: Cart item not found

  /api/cart/delete/items/{cartItemId}:
    delete:
      tags:
        - Shopping Cart
      summary: Remove cart item
      description: Remove a book from the shopping cart.
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Cart item removed successfully
        '404':
          description: Cart item not found

  /api/orders/create:
    post:
      tags:
        - Orders
      summary: Create order
      description: Create an order from the user's shopping cart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid request
        '404':
          description: User or cart not found

  /api/orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get order by ID
      description: Retrieve order details using the order ID.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found

  /api/orders/user/{userId}:
    get:
      tags:
        - Orders
      summary: Get user orders
      description: Retrieve all orders belonging to a user.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'

components:

  schemas:

    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: john
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          example: password123

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          example: password123

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: Login successful
        username:
          type: string
          example: john

    BookRequest:
      type: object
      required:
        - title
        - author
        - price
      properties:
        title:
          type: string
          example: Clean Code
        author:
          type: string
          example: Robert C. Martin
        price:
          type: number
          format: double
          example: 499.99

    BookResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Clean Code
        author:
          type: string
          example: Robert C. Martin
        price:
          type: number
          format: double
          example: 499.99

    AddToCartRequest:
      type: object
      required:
        - userId
        - bookId
        - quantity
      properties:
        userId:
          type: integer
          format: int64
          example: 1
        bookId:
          type: integer
          format: int64
          example: 1
        quantity:
          type: integer
          example: 2

    UpdateCartRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          example: 3

    CartItemResponse:
      type: object
      properties:
        bookId:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Clean Code
        author:
          type: string
          example: Robert C. Martin
        price:
          type: number
          format: double
          example: 499.99
        quantity:
          type: integer
          example: 2
        totalPrice:
          type: number
          format: double
          example: 999.98

    CartResponse:
      type: object
      properties:
        cartId:
          type: integer
          format: int64
          example: 1
        userId:
          type: integer
          format: int64
          example: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemResponse'
        totalPrice:
          type: number
          format: double
          example: 999.98

    CreateOrderRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: integer
          format: int64
          example: 1

    OrderItemResponse:
      type: object
      properties:
        bookId:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Clean Code
        quantity:
          type: integer
          example: 2
        price:
          type: number
          format: double
          example: 499.99
        totalPrice:
          type: number
          format: double
          example: 999.98

    OrderResponse:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
          example: 1
        userId:
          type: integer
          format: int64
          example: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        totalPrice:
          type: number
          format: double
          example: 999.98
        orderDate:
          type: string
          format: date-time
          example: "2026-09-18T18:30:00"